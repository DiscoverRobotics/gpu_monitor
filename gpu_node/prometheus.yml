global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    instance: LAPTOP-WRH

scrape_configs:
  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]
        labels:
          instance: LAPTOP-WRH

remote_write:
  - url: http://43.133.11.173:9090/api/v1/write
    queue_config:
      max_samples_per_send: 1000
      capacity: 10000
      batch_send_deadline: 5s
    write_relabel_configs:
      - source_labels: [__name__]
        regex: "DCGM_.*"
        action: keep
